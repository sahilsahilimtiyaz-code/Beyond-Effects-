name: rebuild-beyond-effects
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'HTTPS URL of the ORIGINAL APK (downloaded to tmp each run, never committed)'
        required: true
        type: string
      apk_sha256:
        description: 'Expected SHA-256 of the original APK'
        required: true
        default: 'f81cc7874b694d192cb5bb381242c26a82347b1c8a967299e7544eb2f62f36cd'
      upload_artifact:
        description: 'Upload rebuilt APK as a run artifact (publicly downloadable while the repo is public)'
        required: false
        default: false
        type: boolean
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK packages (platform-35 + build-tools 35.0.0; SDK preinstalled on runner)
        run: |
          export SDK="$ANDROID_SDK_ROOT"
          echo "SDK=$SDK"
          ls "$SDK/build-tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          "$SDK/build-tools/35.0.0/aapt2" version
      - name: Fetch Apktool 3.0.3 (checksum-pinned)
        run: |
          curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -
      - name: Download + verify original APK (tmp only)
        run: |
          mkdir -p work/tmp
          curl -sL -o work/tmp/orig.apk '${{ inputs.apk_url }}'
          echo '${{ inputs.apk_sha256 }}  work/tmp/orig.apk' | sha256sum -c -
          ls -la work/tmp/orig.apk
      - name: Decode original (disposable tree)
        run: java -jar /tmp/apktool.jar d -f -o work/tree work/tmp/orig.apk
      - name: Check overlay sources present
        run: |
          test -f overlay-8c/activity_home_screen.xml
          test -f overlay-8d/be_final_launcher_192.png
          test -f overlay-8d/staged_ic_launcher.xml
          test -f overlay-8d/staged_ic_launcher_round.xml
          test -f overlay-fx/gm_custom_letterbox.xml
          test -f overlay-fx/gm_custom_bloom_saturation_plus.xml
          test -f overlay-fx/gm_custom_bloom_region_plus.xml
          test -f overlay-fx/gm_custom_letterbox.png
          test -f overlay-fx/gm_custom_bloom_saturation_plus.png
          test -f overlay-fx/gm_custom_bloom_region_plus.png
          test -f overlay-8e/gold_motion_launcher.png
          test -f overlay-8e/gold_motion_logo_splash.png
          test -f overlay-9a/AndroidManifest.xml
          test -f overlay-9a/smali_classes25/com/goldmotion/startup/GoldStartupActivity.smali
          test -f overlay-9a/smali_classes25/com/goldmotion/update/WelcomeDialog.smali
          test -f overlay-9b/res/layout/project_list_sidemenu_header.xml
          test -f overlay-9b/smali_classes32/com/goldmotion/ui/StudioLaunch.smali
          test -f overlay-9c/smali_classes32/com/goldmotion/ui/StudioAppearance.smali
          test -f overlay-9d/smali_classes32/com/goldmotion/ui/GmUiFixes.smali
          test -f overlay-9e/res/values/colors.xml
          test -f overlay-9g/res/values/strings.xml
          test -f overlay-9g/res/layout/gm_projects_page.xml
          test -f overlay-9h/res/drawable/gm_create_primary.xml
          test -f overlay-9h/res/drawable/gm_projects_fab.xml
          test -f overlay-9h/res/drawable/gm_project_selection_bg.xml
          test -f overlay-9i/smali_classes32/com/goldmotion/projects/GmProjectsPage.smali
          test -f overlay-9j/res/layout/project_list_tab_view_homefeed.xml
          test -f overlay-9j/res/layout/project_list_sidemenu_header.xml
          test -f overlay-9j/res/values/strings.xml
          test -f overlay-9j/smali_classes32/com/goldmotion/ui/StudioAppearance.smali
          test -f overlay-9j/smali_classes25/com/goldmotion/customize/CustomizationActivity.smali
          test -f overlay-9k/res/layout/activity_home_screen.xml
          test -f overlay-9l/res/layout/effect_browser_activity.xml
          test -f overlay-9m/smali_classes21/com/zenapp/custom/dialog/Customdialog.smali
          test -f overlay-9m/smali_classes22/android/support/annotation/B.smali
          test -f overlay-10a/res/layout/activity_edit.xml
          test -f overlay-10a/res/layout/activity_edit_playbar.xml
          test -f overlay-10a/res/layout/activity_edit_navbar.xml
          test -f overlay-10a/res/layout/activity_edit_actionbar.xml
          test -f overlay-10a/res/layout/activity_edit_selectbar.xml
          test -f overlay-10b/smali_classes32/com/goldmotion/projects/GmProjectsPage.smali
          test -f overlay-10b/smali_classes32/com/goldmotion/ui/StudioAppearance.smali
          test -f overlay-10b/smali_classes32/com/goldmotion/ui/GmContinueOpener.smali
          test -f overlay-10b/smali_classes32/com/goldmotion/ui/GmNewProjectOpener.smali
          test -f overlay-10c/res/layout/effect_list_item.xml
          test -f overlay-12a/res/layout/activity_edit.xml
          test -f overlay-12a/res/layout/activity_edit_addpopup.xml
          test -f overlay-12a/res/color/be_tab_state.xml
          test -f overlay-11a/smali_classes2/com/alightcreative/app/motion/activities/main/MainActivity\$GoldTelegramClickListener.smali
          test -f overlay-13a/res/layout/create_project_fragment.xml
          test -f overlay-13a/res/values/strings.xml
          test -f overlay-14a/res/layout/gm_projects_page.xml
          test -f overlay-14b/assets/GOLDMOTION.png
          test -f overlay-15a/res/values/dimens.xml
          test -f overlay-15a/res/layout/timeline_header.xml
          test -f overlay-15a/res/layout/effect_search_frag.xml
          test -f overlay-16a/res/drawable/gm_nav_plus_bg.xml
          test -f overlay-16a/res/layout/effect_detail_frag.xml
          test -f overlay-16a/res/layout/effect_category_recommend_frag.xml
          test -f overlay-16a/res/layout/activity_export_preview.xml
          test -f overlay-17a/res/color/be_inspector_label_text.xml
          test -f overlay-17a/res/layout/effect_setting_slider.xml
          test -f overlay-17a/res/layout/effect_setting_text.xml
          test -f overlay-17a/res/xml/preferences.xml
          test -f overlay-17a/res/values/strings.xml
          test -f overlay-9f/smali_classes29/com/goldmotion/backup/GMBackup.smali
          test -f overlay-9f/smali_classes25/com/goldmotion/update/ForceUpdateManager.smali
          test -f overlay-9f/smali_classes24/com/goldmotion/update/ForceUpdateManager.smali
          test -f overlay-9f/smali_classes24/com/goldmotion/update/WelcomeDialog.smali
          echo OVERLAYS-PRESENT
      - name: Guard layout ID contracts (never drop IDs bindings require)
        run: |
          python3 - <<'PYEOF'
          import re, sys
          def ids(p):
              return {i for _, i in re.findall(r'android:id="@(\+?)id/([^"]+)"', open(p, encoding='utf-8').read())}
          pairs = [
              ('overlay-9j/res/layout/project_list_sidemenu_header.xml', 'work/tree/res/layout/project_list_sidemenu_header.xml'),
              ('overlay-9j/res/layout/project_list_tab_view_homefeed.xml', 'work/tree/res/layout/project_list_tab_view_homefeed.xml'),
              ('overlay-9k/res/layout/activity_home_screen.xml', 'work/tree/res/layout/activity_home_screen.xml'),
              ('overlay-9l/res/layout/effect_browser_activity.xml', 'work/tree/res/layout/effect_browser_activity.xml'),
              ('overlay-10a/res/layout/activity_edit.xml', 'work/tree/res/layout/activity_edit.xml'),
              ('overlay-10a/res/layout/activity_edit_playbar.xml', 'work/tree/res/layout/activity_edit_playbar.xml'),
              ('overlay-10a/res/layout/activity_edit_navbar.xml', 'work/tree/res/layout/activity_edit_navbar.xml'),
              ('overlay-10a/res/layout/activity_edit_actionbar.xml', 'work/tree/res/layout/activity_edit_actionbar.xml'),
              ('overlay-10a/res/layout/activity_edit_selectbar.xml', 'work/tree/res/layout/activity_edit_selectbar.xml'),
              ('overlay-10c/res/layout/effect_list_item.xml', 'work/tree/res/layout/effect_list_item.xml'),
              ('overlay-12a/res/layout/activity_edit.xml', 'work/tree/res/layout/activity_edit.xml'),
              ('overlay-12a/res/layout/activity_edit_addpopup.xml', 'work/tree/res/layout/activity_edit_addpopup.xml'),
              ('overlay-14a/res/layout/gm_projects_page.xml', 'work/tree/res/layout/gm_projects_page.xml'),
              ('overlay-15a/res/layout/timeline_header.xml', 'work/tree/res/layout/timeline_header.xml'),
              ('overlay-15a/res/layout/effect_search_frag.xml', 'work/tree/res/layout/effect_search_frag.xml'),
              ('overlay-16a/res/layout/effect_detail_frag.xml', 'work/tree/res/layout/effect_detail_frag.xml'),
              ('overlay-16a/res/layout/effect_category_recommend_frag.xml', 'work/tree/res/layout/effect_category_recommend_frag.xml'),
              ('overlay-16a/res/layout/activity_export_preview.xml', 'work/tree/res/layout/activity_export_preview.xml'),
              ('overlay-17a/res/layout/effect_setting_slider.xml', 'work/tree/res/layout/effect_setting_slider.xml'),
              ('overlay-17a/res/layout/effect_setting_color.xml', 'work/tree/res/layout/effect_setting_color.xml'),
              ('overlay-17a/res/layout/effect_setting_pos.xml', 'work/tree/res/layout/effect_setting_pos.xml'),
              ('overlay-17a/res/layout/effect_setting_xyz.xml', 'work/tree/res/layout/effect_setting_xyz.xml'),
              ('overlay-17a/res/layout/effect_setting_spinner.xml', 'work/tree/res/layout/effect_setting_spinner.xml'),
              ('overlay-17a/res/layout/effect_setting_selector.xml', 'work/tree/res/layout/effect_setting_selector.xml'),
              ('overlay-17a/res/layout/effect_setting_text.xml', 'work/tree/res/layout/effect_setting_text.xml'),
              ('overlay-17a/res/xml/preferences.xml', 'work/tree/res/xml/preferences.xml'),
          ]
          bad = 0
          for o, t in pairs:
              missing = ids(t) - ids(o)
              if missing:
                  print(f'ID-CONTRACT-FAIL {o} drops {sorted(missing)}')
                  bad += 1
          if bad:
              sys.exit(1)
          print('ID-CONTRACT-OK')
          PYEOF
      - name: Apply overlays additively (8C home + 8D icons)
        run: |
          T=work/tree
          mkdir -p "$T/res/layout" "$T/res/drawable" "$T/res/mipmap-mdpi" "$T/res/mipmap-hdpi" "$T/res/mipmap-xhdpi" "$T/res/mipmap-xxhdpi" "$T/res/mipmap-xxxhdpi" "$T/res/mipmap-anydpi-v26"
          cp overlay-8c/activity_home_screen.xml "$T/res/layout/activity_home_screen.xml"
          cp overlay-8d/be_final_launcher_192.png "$T/res/mipmap-xxxhdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_144.png "$T/res/mipmap-xxhdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_96.png "$T/res/mipmap-xhdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_72.png "$T/res/mipmap-hdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_48.png "$T/res/mipmap-mdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_round_192.png "$T/res/mipmap-xxxhdpi/ic_launcher_round.png"
          cp overlay-8d/be_final_fg_432.png "$T/res/drawable/be_final_fg.png"
          cp overlay-8d/staged_ic_launcher.xml "$T/res/mipmap-anydpi-v26/ic_launcher.xml"
          cp overlay-8d/staged_ic_launcher_round.xml "$T/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo OVERLAYS-APPLIED
      - name: Apply custom effects (2P letterbox + 2X sat+ + 6B region+; 2N placement precedent)
        run: |
          T=work/tree
          mkdir -p "$T/assets/effects_custom" "$T/assets/thumb"
          cp overlay-fx/gm_custom_letterbox.xml "$T/assets/effects_custom/gm_custom_letterbox.xml"
          cp overlay-fx/gm_custom_bloom_saturation_plus.xml "$T/assets/effects_custom/gm_custom_bloom_saturation_plus.xml"
          cp overlay-fx/gm_custom_bloom_region_plus.xml "$T/assets/effects_custom/gm_custom_bloom_region_plus.xml"
          cp overlay-fx/gm_custom_letterbox.png "$T/assets/thumb/gm_custom_letterbox.png"
          cp overlay-fx/gm_custom_bloom_saturation_plus.png "$T/assets/thumb/gm_custom_bloom_saturation_plus.png"
          cp overlay-fx/gm_custom_bloom_region_plus.png "$T/assets/thumb/gm_custom_bloom_region_plus.png"
          echo FX-APPLIED
      - name: Apply displayed-surface fixes (8E icon + splash, manifest/theme live paths)
        run: |
          T=work/tree
          cp overlay-8e/gold_motion_launcher.png "$T/res/drawable-nodpi/gold_motion_launcher.png"
          cp overlay-8e/gold_motion_logo_splash.png "$T/res/drawable-nodpi/gold_motion_logo_splash.png"
          cp overlay-8e/gold_motion_launcher.png "$T/unknown/res/drawable-nodpi-v4/gold_motion_launcher.png"
          cp overlay-8e/gold_motion_logo_splash.png "$T/unknown/res/drawable-nodpi-v4/gold_motion_logo_splash.png"
          echo DISPLAY-APPLIED
      - name: Apply onboarding rebrand (8F smali literals, GoldStartupActivity screens)
        run: |
          T=work/tree/smali_classes25/com/goldmotion/startup
          S=overlay-8f/smali_classes25/com/goldmotion/startup
          cp "$S/GoldStartupActivity.smali" "$T/GoldStartupActivity.smali"
          cp "$S/GoldStartupActivity\$3.smali" "$T/GoldStartupActivity\$3.smali"
          cp "$S/GoldStartupActivity\$5.smali" "$T/GoldStartupActivity\$5.smali"
          cp "$S/GoldStartupActivity\$5\$3.smali" "$T/GoldStartupActivity\$5\$3.smali"
          cp "$S/GoldStartupActivity\$6.smali" "$T/GoldStartupActivity\$6.smali"
          cp "$S/GoldStartupActivity\$6\$4.smali" "$T/GoldStartupActivity\$6\$4.smali"
          echo SMALI-APPLIED
      - name: Apply Octavian identity (9A manifest + res + smali + promo-source)
        run: |
          T=work/tree
          cp overlay-9a/AndroidManifest.xml "$T/AndroidManifest.xml"
          cp overlay-9a/res/xml/dev_preferences.xml "$T/res/xml/dev_preferences.xml"
          S9=overlay-9a/smali_classes25/com/goldmotion/startup
          T9="$T/smali_classes25/com/goldmotion/startup"
          cp "$S9/GoldStartupActivity.smali" "$T9/GoldStartupActivity.smali"
          cp "$S9/GoldStartupActivity\$2.smali" "$T9/GoldStartupActivity\$2.smali"
          cp "$S9/GoldStartupActivity\$9.smali" "$T9/GoldStartupActivity\$9.smali"
          cp overlay-9a/smali_classes25/com/goldmotion/update/WelcomeDialog.smali "$T/smali_classes25/com/goldmotion/update/WelcomeDialog.smali"
          cp overlay-9a/smali_classes10/com/alightcreative/share/NS.smali "$T/smali_classes10/com/alightcreative/share/NS.smali"
          cp "overlay-9a/smali_classes13/XBJ/cn\$NS.smali" "$T/smali_classes13/XBJ/cn\$NS.smali"
          cp overlay-9a/smali_classes2/com/alightcreative/app/motion/activities/ExportPreviewActivity.smali "$T/smali_classes2/com/alightcreative/app/motion/activities/ExportPreviewActivity.smali"
          cp overlay-9a/smali_classes3/com/alightcreative/widget/TimelineBackgroundView.smali "$T/smali_classes3/com/alightcreative/widget/TimelineBackgroundView.smali"
          echo IDENTITY-APPLIED
      - name: Apply Beyond identity fixes (9B launch-mark + sns-row removal)
        run: |
          T=work/tree
          cp overlay-9b/res/layout/project_list_sidemenu_header.xml "$T/res/layout/project_list_sidemenu_header.xml"
          cp overlay-9b/smali_classes32/com/goldmotion/ui/StudioLaunch.smali "$T/smali_classes32/com/goldmotion/ui/StudioLaunch.smali"
          cp "overlay-9b/smali_classes32/com/goldmotion/ui/StudioLaunch\$Mark.smali" "$T/smali_classes32/com/goldmotion/ui/StudioLaunch\$Mark.smali"
          echo BEYOND-APPLIED
      - name: Apply workspace promo removal (9C home-stage follow block)
        run: |
          T=work/tree
          cp overlay-9c/smali_classes32/com/goldmotion/ui/StudioAppearance.smali "$T/smali_classes32/com/goldmotion/ui/StudioAppearance.smali"
          echo WORKSPACE-APPLIED
      - name: Apply editor shell theming (9D toolbar + holders, live MainActivity path)
        run: |
          T=work/tree
          cp overlay-9d/smali_classes32/com/goldmotion/ui/GmUiFixes.smali "$T/smali_classes32/com/goldmotion/ui/GmUiFixes.smali"
          echo SHELL-APPLIED
      - name: Apply palette restyle (9E gold-to-crimson resource tokens)
        run: |
          T=work/tree
          cp overlay-9e/res/values/colors.xml "$T/res/values/colors.xml"
          python3 -c "import re; d=open('overlay-9e/res/values/colors.xml',encoding='utf-8').read(); old=re.findall(r'f6c945|ffe08a|e6a817|b87800|f9de66|fad961|ffd76a|efcc76|f4e0af|efd8a1|ffcd4b', d, re.I); print('residual gold hexes:', len(old)); raise SystemExit(1 if old else 0)"
          echo PALETTE-APPLIED
      - name: Apply workspace rebrand (9G app_name + page accents)
        run: |
          T=work/tree
          cp overlay-9g/res/values/strings.xml "$T/res/values/strings.xml"
          cp overlay-9g/res/layout/gm_projects_page.xml "$T/res/layout/gm_projects_page.xml"
          echo WORKSPACE-BRAND-APPLIED
      - name: Apply action surfaces (9H crimson primary buttons + selection)
        run: |
          T=work/tree
          cp overlay-9h/res/drawable/gm_create_primary.xml "$T/res/drawable/gm_create_primary.xml"
          cp overlay-9h/res/drawable/gm_projects_fab.xml "$T/res/drawable/gm_projects_fab.xml"
          cp overlay-9h/res/drawable/gm_project_selection_bg.xml "$T/res/drawable/gm_project_selection_bg.xml"
          echo ACTIONS-APPLIED
      - name: Apply gallery card redesign (9I GmProjectsPage geometry)
        run: |
          T=work/tree
          cp overlay-9i/smali_classes32/com/goldmotion/projects/GmProjectsPage.smali "$T/smali_classes32/com/goldmotion/projects/GmProjectsPage.smali"
          echo GALLERY-APPLIED
      - name: Apply home dashboard + promo purge (9J feed/studio/drawer/strings/customize)
        run: |
          T=work/tree
          cp overlay-9j/res/layout/project_list_tab_view_homefeed.xml "$T/res/layout/project_list_tab_view_homefeed.xml"
          cp overlay-9j/res/layout/project_list_sidemenu_header.xml "$T/res/layout/project_list_sidemenu_header.xml"
          cp overlay-9j/res/values/strings.xml "$T/res/values/strings.xml"
          cp overlay-9j/smali_classes32/com/goldmotion/ui/StudioAppearance.smali "$T/smali_classes32/com/goldmotion/ui/StudioAppearance.smali"
          cp overlay-9j/smali_classes25/com/goldmotion/customize/CustomizationActivity.smali "$T/smali_classes25/com/goldmotion/customize/CustomizationActivity.smali"
          echo HOME-APPLIED
      - name: Apply loading compact (9K setup overlay)
        run: |
          T=work/tree
          cp overlay-9k/res/layout/activity_home_screen.xml "$T/res/layout/activity_home_screen.xml"
          echo LOADING-APPLIED
      - name: Apply effects header (9L two-line browser header)
        run: |
          T=work/tree
          cp overlay-9l/res/layout/effect_browser_activity.xml "$T/res/layout/effect_browser_activity.xml"
          echo EFFECTS-APPLIED
      - name: Apply promo-dialog purge (9M zenapp/annotated dialog texts)
        run: |
          T=work/tree
          cp overlay-9m/smali_classes21/com/zenapp/custom/dialog/Customdialog.smali "$T/smali_classes21/com/zenapp/custom/dialog/Customdialog.smali"
          cp overlay-9m/smali_classes22/android/support/annotation/B.smali "$T/smali_classes22/android/support/annotation/B.smali"
          echo PROMO-APPLIED
      - name: Apply editor cockpit (10A regrouped bars + timeline rows)
        run: |
          T=work/tree
          cp overlay-10a/res/layout/activity_edit.xml "$T/res/layout/activity_edit.xml"
          cp overlay-10a/res/layout/activity_edit_playbar.xml "$T/res/layout/activity_edit_playbar.xml"
          cp overlay-10a/res/layout/activity_edit_navbar.xml "$T/res/layout/activity_edit_navbar.xml"
          cp overlay-10a/res/layout/activity_edit_actionbar.xml "$T/res/layout/activity_edit_actionbar.xml"
          cp overlay-10a/res/layout/activity_edit_selectbar.xml "$T/res/layout/activity_edit_selectbar.xml"
          echo COCKPIT-APPLIED
      - name: Apply home continue + new-project (10B real-data card + GmNavBar.plus action)
        run: |
          T=work/tree
          cp overlay-10b/smali_classes32/com/goldmotion/projects/GmProjectsPage.smali "$T/smali_classes32/com/goldmotion/projects/GmProjectsPage.smali"
          cp overlay-10b/smali_classes32/com/goldmotion/ui/StudioAppearance.smali "$T/smali_classes32/com/goldmotion/ui/StudioAppearance.smali"
          cp overlay-10b/smali_classes32/com/goldmotion/ui/GmContinueOpener.smali "$T/smali_classes32/com/goldmotion/ui/GmContinueOpener.smali"
          cp overlay-10b/smali_classes32/com/goldmotion/ui/GmNewProjectOpener.smali "$T/smali_classes32/com/goldmotion/ui/GmNewProjectOpener.smali"
          echo CONTINUE-APPLIED
      - name: Apply effect row regroup (10C grip-leading rows)
        run: |
          T=work/tree
          cp overlay-10c/res/layout/effect_list_item.xml "$T/res/layout/effect_list_item.xml"
          echo FXROW-APPLIED
      - name: Apply editor stage + add panel (12A stage frame, touch zones, tab states)
        run: |
          T=work/tree
          cp overlay-12a/res/layout/activity_edit.xml "$T/res/layout/activity_edit.xml"
          cp overlay-12a/res/layout/activity_edit_addpopup.xml "$T/res/layout/activity_edit_addpopup.xml"
          cp overlay-12a/res/color/be_tab_state.xml "$T/res/color/be_tab_state.xml"
          echo STAGE-APPLIED
      - name: Apply dead-listener URL strip (11A telegram click)
        run: |
          T=work/tree
          cp "overlay-11a/smali_classes2/com/alightcreative/app/motion/activities/main/MainActivity\$GoldTelegramClickListener.smali" "$T/smali_classes2/com/alightcreative/app/motion/activities/main/MainActivity\$GoldTelegramClickListener.smali"
          echo P0-APPLIED
      - name: Apply creation form (13A header hierarchy + category rebrand)
        run: |
          T=work/tree
          cp overlay-13a/res/layout/create_project_fragment.xml "$T/res/layout/create_project_fragment.xml"
          cp overlay-13a/res/values/strings.xml "$T/res/values/strings.xml"
          echo CREATE-APPLIED
      - name: Apply library header + logo asset (14A compact toolbar, 14B transparent mark)
        run: |
          T=work/tree
          cp overlay-14a/res/layout/gm_projects_page.xml "$T/res/layout/gm_projects_page.xml"
          cp overlay-14b/assets/GOLDMOTION.png "$T/assets/GOLDMOTION.png"
          echo LIBRARY-APPLIED
      - name: Apply timeline/search refinement (15A row alignment, header, search zone)
        run: |
          T=work/tree
          cp overlay-15a/res/values/dimens.xml "$T/res/values/dimens.xml"
          cp overlay-15a/res/layout/timeline_header.xml "$T/res/layout/timeline_header.xml"
          cp overlay-15a/res/layout/effect_search_frag.xml "$T/res/layout/effect_search_frag.xml"
          echo TIMELINE-APPLIED
      - name: Apply effects/export/nav refinement (16A detail, recommend, export, plus)
        run: |
          T=work/tree
          cp overlay-16a/res/drawable/gm_nav_plus_bg.xml "$T/res/drawable/gm_nav_plus_bg.xml"
          cp overlay-16a/res/layout/effect_detail_frag.xml "$T/res/layout/effect_detail_frag.xml"
          cp overlay-16a/res/layout/effect_category_recommend_frag.xml "$T/res/layout/effect_category_recommend_frag.xml"
          cp overlay-16a/res/layout/activity_export_preview.xml "$T/res/layout/activity_export_preview.xml"
          echo FXDEPTH-APPLIED
      - name: Apply inspector + settings (17A mint label states, thumb, grouped prefs)
        run: |
          T=work/tree
          cp overlay-17a/res/color/be_inspector_label_text.xml "$T/res/color/be_inspector_label_text.xml"
          cp overlay-17a/res/layout/effect_setting_slider.xml "$T/res/layout/effect_setting_slider.xml"
          cp overlay-17a/res/layout/effect_setting_color.xml "$T/res/layout/effect_setting_color.xml"
          cp overlay-17a/res/layout/effect_setting_pos.xml "$T/res/layout/effect_setting_pos.xml"
          cp overlay-17a/res/layout/effect_setting_xyz.xml "$T/res/layout/effect_setting_xyz.xml"
          cp overlay-17a/res/layout/effect_setting_spinner.xml "$T/res/layout/effect_setting_spinner.xml"
          cp overlay-17a/res/layout/effect_setting_selector.xml "$T/res/layout/effect_setting_selector.xml"
          cp overlay-17a/res/layout/effect_setting_text.xml "$T/res/layout/effect_setting_text.xml"
          cp overlay-17a/res/xml/preferences.xml "$T/res/xml/preferences.xml"
          cp overlay-17a/res/values/strings.xml "$T/res/values/strings.xml"
          echo INSPECTOR-APPLIED
      # BISECT-2: 9N copy stays disabled (whole-file smali reassembly suspect);
      # follow-toast returns until a surgical single-line patch replaces it.
      # BISECT 2026-10-15: 10A/10B/10C unwired after startup-crash report on
      # run 38694780463. Overlay dirs retained in repo for reintroduction.
      #   - name: Apply editor cockpit (10A regrouped bars + timeline rows) [DISABLED]
      #   - name: Apply home continue card (10B recent-data accessors + injection) [DISABLED]
      #   - name: Apply effect row regroup (10C grip-leading rows) [DISABLED]
      - name: Apply storage fix (9F MANAGE redirect removal; MediaStore path kept)
        run: |
          T=work/tree
          cp overlay-9f/smali_classes29/com/goldmotion/backup/GMBackup.smali "$T/smali_classes29/com/goldmotion/backup/GMBackup.smali"
          cp overlay-9f/smali_classes25/com/goldmotion/update/ForceUpdateManager.smali "$T/smali_classes25/com/goldmotion/update/ForceUpdateManager.smali"
          cp overlay-9f/smali_classes24/com/goldmotion/update/ForceUpdateManager.smali "$T/smali_classes24/com/goldmotion/update/ForceUpdateManager.smali"
          cp overlay-9f/smali_classes24/com/goldmotion/update/WelcomeDialog.smali "$T/smali_classes24/com/goldmotion/update/WelcomeDialog.smali"
          echo STORAGE-APPLIED
      - name: Rebuild with apktool (aapt2 from build-tools 35.0.0)
        run: java -jar /tmp/apktool.jar b work/tree -o work/be-rebuilt-unsigned.apk
      - name: Inspect APK contents (prove structures shipped, not just sources)
        run: |
          grep -q "beCreateHeader" work/tree/res/layout/create_project_fragment.xml && echo CREATE-HEADER-OK || exit 1
          grep -q "browserTitle" work/tree/res/layout/effect_browser_activity.xml && echo FXHEADER-OK || exit 1
          grep -q "elementTabHolder" work/tree/res/layout/activity_edit_addpopup.xml && echo ADDPANEL-OK || exit 1
          grep -q "goldHomeStage" work/tree/res/layout/project_list_tab_view_homefeed.xml && echo HOMEFEED-OK || exit 1
          for f in res/layout/create_project_fragment.xml res/layout/effect_browser_activity.xml res/layout/activity_edit_addpopup.xml res/layout/project_list_tab_view_homefeed.xml res/color/be_tab_state.xml; do
            unzip -l work/be-rebuilt-unsigned.apk | grep -q "$f" || exit 1
          done
          echo ENTRIES-OK
          unzip -p work/be-rebuilt-unsigned.apk 'classes*.dex' | grep -a -c 'GmNewProjectOpener' | grep -q -E '[1-9]' && echo NEWPROJ-CODE-OK || exit 1
          unzip -p work/be-rebuilt-unsigned.apk 'classes*.dex' | grep -a -c 'continueCard' | grep -q -E '[1-9]' && echo CONTINUE-CODE-OK || exit 1
      - name: Align + sign with in-run throwaway key (test lineage only)
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f 4 work/be-rebuilt-unsigned.apk work/be-rebuilt-aligned.apk
          keytool -genkeypair -keystore work/tmp/testkey.jks -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testtest -keypass testtest -dname "CN=BeyondEffects-Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
          "$BT/apksigner" sign --ks work/tmp/testkey.jks --ks-pass pass:testtest --key-pass pass:testtest --out work/be-rebuilt-signed.apk work/be-rebuilt-aligned.apk
          echo SIGNED
      - name: Verification gates (packaging only, never runtime)
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -c 4 work/be-rebuilt-signed.apk && echo ZIPALIGN-OK
          "$BT/apksigner" verify --print-certs work/be-rebuilt-signed.apk
          "$BT/aapt2" dump badging work/be-rebuilt-signed.apk | head -1 | grep -F "package: name='com.octavian'" && echo PACKAGE-OK
          "$BT/aapt2" dump badging work/be-rebuilt-signed.apk | grep -F "application-label:'Beyond Effects'" && echo LABEL-OK
          unzip -l work/be-rebuilt-signed.apk | grep -E 'be_final_fg|activity_home_screen' && echo ENTRIES-OK
          unzip -l work/be-rebuilt-signed.apk | grep -E 'effects_custom/gm_custom_(letterbox|bloom_saturation_plus|bloom_region_plus)\.xml' && echo FX-XML-OK
          unzip -l work/be-rebuilt-signed.apk | grep -E 'assets/thumb/gm_custom_(letterbox|bloom_saturation_plus|bloom_region_plus)\.png' && echo FX-THUMB-OK
          unzip -l work/be-rebuilt-signed.apk | grep 'gold_motion_launcher.png'
          unzip -l work/be-rebuilt-signed.apk | awk '/gold_motion_launcher\.png/ && $1 == 226477 {bad=1} END {exit bad}' && echo ICON-REPLACED
          unzip -l work/be-rebuilt-signed.apk | grep 'gold_motion_logo_splash.png'
          unzip -l work/be-rebuilt-signed.apk | awk '/gold_motion_logo_splash\.png/ && $1 == 77662 {bad=1} END {exit bad}' && echo SPLASH-REPLACED
          CNT=$(for d in $(unzip -l work/be-rebuilt-signed.apk | awk '/classes[0-9]+\.dex/ {print $4}'); do unzip -p work/be-rebuilt-signed.apk "$d"; done | grep -a -o 'BEYOND EFFECTS' | wc -l); echo "BEYOND-DEX-COUNT=$CNT"
          for d in $(unzip -l work/be-rebuilt-signed.apk | awk '/classes[0-9]+\.dex/ {print $4}'); do unzip -p work/be-rebuilt-signed.apk "$d"; done | grep -a -q 'WELCOME TO BEYOND EFFECTS' && echo SMALI-WELCOME-OK || exit 1
          for d in $(unzip -l work/be-rebuilt-signed.apk | awk '/classes[0-9]+\.dex/ {print $4}'); do unzip -p work/be-rebuilt-signed.apk "$d"; done | grep -a -q 'ENTER BEYOND EFFECTS' && echo SMALI-ENTER-OK || exit 1
          for d in $(unzip -l work/be-rebuilt-signed.apk | awk '/classes[0-9]+\.dex/ {print $4}'); do unzip -p work/be-rebuilt-signed.apk "$d"; done | grep -a -o 'Beyond Effects' | wc -l | grep -q -E '[1-9]' && echo WORDMARK-OK || exit 1
          test "$(unzip -p work/be-rebuilt-signed.apk AndroidManifest.xml | grep -a -c 'MANAGE_EXTERNAL_STORAGE')" = "0" && echo MANAGE-GONE || exit 1
          test "$(unzip -p work/be-rebuilt-signed.apk 'classes*.dex' | grep -a -c 'fwpnkj' || true)" = "0" && echo PROMO-GONE || exit 1
          "$BT/aapt2" dump resources work/be-rebuilt-signed.apk 2>/dev/null | grep -c 'Beyond Effects' | grep -q -E '[1-9]' && echo STRINGS-OK || exit 1
          "$BT/aapt2" dump resources work/be-rebuilt-signed.apk 2>/dev/null | grep -c 'Beyond Effects' | grep -q -E '[1-9]' && echo STRINGS-OK || exit 1
          "$BT/aapt2" dump xmltree work/be-rebuilt-signed.apk --file res/layout/project_list_sidemenu_header.xml > /tmp/be_header.txt 2>&1; grep -c 'Beyond Effects' /tmp/be_header.txt | grep -q -E '[1-9]' && echo DRAWER-BRAND-OK || exit 1
          sha256sum work/be-rebuilt-signed.apk
      - name: Upload rebuilt APK (only if requested)
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: be-rebuilt-signed
          path: work/be-rebuilt-signed.apk
          retention-days: 7
