name: rebuild-beyond-effects
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'HTTPS URL of the ORIGINAL APK (downloaded to tmp each run, never committed)'
        required: true
        type: string
      apk_sha256:
        description: 'Expected SHA-256 of the original APK'
        required: true
        default: 'f81cc7874b694d192cb5bb381242c26a82347b1c8a967299e7544eb2f62f36cd'
      upload_artifact:
        description: 'Upload rebuilt APK as a run artifact (publicly downloadable while the repo is public)'
        required: false
        default: false
        type: boolean
      push_source:
        description: 'Publish the fully-merged decoded tree to branch "source" (generated branch; force-refreshed when re-run)'
        required: false
        default: false
        type: boolean
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK packages (platform-35 + build-tools 35.0.0; SDK preinstalled on runner)
        run: |
          export SDK="$ANDROID_SDK_ROOT"
          echo "SDK=$SDK"
          ls "$SDK/build-tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          "$SDK/build-tools/35.0.0/aapt2" version
      - name: Fetch Apktool 3.0.3 (checksum-pinned)
        run: |
          curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -
      - name: Download + verify original APK (tmp only)
        run: |
          mkdir -p work/tmp
          curl -sL -o work/tmp/orig.apk '${{ inputs.apk_url }}'
          echo '${{ inputs.apk_sha256 }}  work/tmp/orig.apk' | sha256sum -c -
          ls -la work/tmp/orig.apk
      - name: Decode original (disposable tree)
        run: java -jar /tmp/apktool.jar d -f -o work/tree work/tmp/orig.apk
      - name: Check overlay sources present
        run: |
          test -f overlay-8c/activity_home_screen.xml
          test -f overlay-8d/be_final_launcher_192.png
