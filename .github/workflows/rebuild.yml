name: rebuild-beyond-effects
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'HTTPS URL of the ORIGINAL APK (downloaded to tmp each run, never committed)'
        required: true
        type: string
      apk_sha256:
        description: 'Expected SHA-256 of the original APK'
        required: true
        default: 'f81cc7874b694d192cb5bb381242c26a82347b1c8a967299e7544eb2f62f36cd'
      upload_artifact:
        description: 'Upload rebuilt APK as a run artifact (publicly downloadable while the repo is public)'
        required: false
        default: false
        type: boolean
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages (platform-35 + build-tools 35.0.0)
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" version
      - name: Fetch Apktool 3.0.3 (checksum-pinned)
        run: |
          curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -
      - name: Download + verify original APK (tmp only)
        run: |
          mkdir -p work/tmp
          curl -sL -o work/tmp/orig.apk '${{ inputs.apk_url }}'
          echo '${{ inputs.apk_sha256 }}  work/tmp/orig.apk' | sha256sum -c -
          ls -la work/tmp/orig.apk
      - name: Decode original (disposable tree)
        run: java -jar /tmp/apktool.jar d -f -o work/tree work/tmp/orig.apk
      - name: Check overlay sources present
        run: |
          test -f overlay-8c/activity_home_screen.xml
          test -f overlay-8d/be_final_launcher_192.png
          test -f overlay-8d/staged_ic_launcher.xml
          test -f overlay-8d/staged_ic_launcher_round.xml
          echo OVERLAYS-PRESENT
      - name: Apply overlays additively (8C home + 8D icons)
        run: |
          T=work/tree
          cp overlay-8c/activity_home_screen.xml "$T/res/layout/activity_home_screen.xml"
          mkdir -p "$T/res/mipmap-xxxhdpi"
          cp overlay-8d/be_final_launcher_192.png "$T/res/mipmap-xxxhdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_144.png "$T/res/mipmap-xxhdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_96.png "$T/res/mipmap-xhdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_72.png "$T/res/mipmap-hdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_48.png "$T/res/mipmap-mdpi/ic_launcher.png"
          cp overlay-8d/be_final_launcher_round_192.png "$T/res/mipmap-xxxhdpi/ic_launcher_round.png"
          cp overlay-8d/be_final_fg_432.png "$T/res/drawable/be_final_fg.png"
          cp overlay-8d/staged_ic_launcher.xml "$T/res/mipmap-anydpi-v26/ic_launcher.xml"
          cp overlay-8d/staged_ic_launcher_round.xml "$T/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo OVERLAYS-APPLIED
      - name: Rebuild with apktool (aapt2 from build-tools 35.0.0)
        run: java -jar /tmp/apktool.jar b work/tree -o work/be-rebuilt-unsigned.apk
      - name: Align + sign with in-run throwaway key (test lineage only)
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f 4 work/be-rebuilt-unsigned.apk work/be-rebuilt-aligned.apk
          keytool -genkeypair -keystore work/tmp/testkey.jks -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testtest -keypass testtest -dname "CN=BeyondEffects-Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
          "$BT/apksigner" sign --ks work/tmp/testkey.jks --ks-pass:pass:testtest --key-pass:pass:testtest --out work/be-rebuilt-signed.apk work/be-rebuilt-aligned.apk
          echo SIGNED
      - name: Verification gates (packaging only, never runtime)
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -c 4 work/be-rebuilt-signed.apk && echo ZIPALIGN-OK
          "$BT/apksigner" verify --print-certs work/be-rebuilt-signed.apk
          "$BT/aapt2" dump badging work/be-rebuilt-signed.apk | head -1 | grep -F "package: name='com.goldmotion.pnkj'" && echo PACKAGE-OK
          unzip -l work/be-rebuilt-signed.apk | grep -E 'be_final_fg|activity_home_screen' && echo ENTRIES-OK
          sha256sum work/be-rebuilt-signed.apk
      - name: Upload rebuilt APK (only if requested)
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: be-rebuilt-signed
          path: work/be-rebuilt-signed.apk
          retention-days: 7
