      - name: Rebuild with apktool (aapt2 from build-tools 35.0.0)
        run: java -jar /tmp/apktool.jar b work/tree -o work/be-rebuilt-unsigned.apk
      - name: Inspect APK contents (prove structures shipped, not just sources)
        run: |
          grep -q "beCreateHeader" work/tree/res/layout/create_project_fragment.xml && echo CREATE-HEADER-OK || exit 1
          grep -q "browserTitle" work/tree/res/layout/effect_browser_activity.xml && echo FXHEADER-OK || exit 1
          grep -q "elementTabHolder" work/tree/res/layout/activity_edit_addpopup.xml && echo ADDPANEL-OK || exit 1
          grep -q "goldHomeStage" work/tree/res/layout/project_list_tab_view_homefeed.xml && echo HOMEFEED-OK || exit 1
          for f in res/layout/create_project_fragment.xml res/layout/effect_browser_activity.xml res/layout/activity_edit_addpopup.xml res/layout/project_list_tab_view_homefeed.xml res/color/be_tab_state.xml; do
            unzip -l work/be-rebuilt-unsigned.apk | grep -q "$f" || exit 1
          done
          echo ENTRIES-OK
          unzip -p work/be-rebuilt-unsigned.apk 'classes*.dex' | grep -a -c 'GmNewProjectOpener' | grep -q -E '[1-9]' && echo NEWPROJ-CODE-OK || exit 1
          unzip -p work/be-rebuilt-unsigned.apk 'classes*.dex' | grep -a -c 'continueCard' | grep -q -E '[1-9]' && echo CONTINUE-CODE-OK || exit 1
      - name: Align + sign with in-run throwaway key (test lineage only)
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f 4 work/be-rebuilt-unsigned.apk work/be-rebuilt-aligned.apk
          keytool -genkeypair -keystore work/tmp/testkey.jks -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testtest -keypass testtest -dname "CN=BeyondEffects-Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
          "$BT/apksigner" sign --ks work/tmp/testkey.jks --ks-pass pass:testtest --key-pass pass:testtest --out work/be-rebuilt-signed.apk work/be-rebuilt-aligned.apk
          echo SIGNED
      - name: Verification gates (packaging only, never runtime)
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -c 4 work/be-rebuilt-signed.apk && echo ZIPALIGN-OK
          "$BT/apksigner" verify --print-certs work/be-rebuilt-signed.apk
          "$BT/aapt2" dump badging work/be-rebuilt-signed.apk | head -1 | grep -F "package: name='com.octavian'" && echo PACKAGE-OK
          "$BT/aapt2" dump badging work/be-rebuilt-signed.apk | grep -F "application-label:'Beyond Effects'" && echo LABEL-OK
          unzip -l work/be-rebuilt-signed.apk | grep -E 'be_final_fg|activity_home_screen' && echo ENTRIES-OK
          unzip -l work/be-rebuilt-signed.apk | grep -E 'effects_custom/gm_custom_(letterbox|bloom_saturation_plus|bloom_region_plus)\.xml' && echo FX-XML-OK
          unzip -l work/be-rebuilt-signed.apk | grep -E 'assets/thumb/gm_custom_(letterbox|bloom_saturation_plus|bloom_region_plus)\.png' && echo FX-THUMB-OK
          unzip -l work/be-rebuilt-signed.apk | grep 'gold_motion_launcher.png'
          unzip -l work/be-rebuilt-signed.apk | awk '/gold_motion_launcher\.png/ && $1 == 226477 {bad=1} END {exit bad}' && echo ICON-REPLACED
          unzip -l work/be-rebuilt-signed.apk | grep 'gold_motion_logo_splash.png'
          unzip -l work/be-rebuilt-signed.apk | awk '/gold_motion_logo_splash\.png/ && $1 == 77662 {bad=1} END {exit bad}' && echo SPLASH-REPLACED
          CNT=$(for d in $(unzip -l work/be-rebuilt-signed.apk | awk '/classes[0-9]+\.dex/ {print $4}'); do unzip -p work/be-rebuilt-signed.apk "$d"; done | grep -a -o 'BEYOND EFFECTS' | wc -l); echo "BEYOND-DEX-COUNT=$CNT"
          for d in $(unzip -l work/be-rebuilt-signed.apk | awk '/classes[0-9]+\.dex/ {print $4}'); do unzip -p work/be-rebuilt-signed.apk "$d"; done | grep -a -q 'WELCOME TO BEYOND EFFECTS' && echo SMALI-WELCOME-OK || exit 1
          for d in $(unzip -l work/be-rebuilt-signed.apk | awk '/classes[0-9]+\.dex/ {print $4}'); do unzip -p work/be-rebuilt-signed.apk "$d"; done | grep -a -q 'ENTER BEYOND EFFECTS' && echo SMALI-ENTER-OK || exit 1
          for d in $(unzip -l work/be-rebuilt-signed.apk | awk '/classes[0-9]+\.dex/ {print $4}'); do unzip -p work/be-rebuilt-signed.apk "$d"; done | grep -a -o 'Beyond Effects' | wc -l | grep -q -E '[1-9]' && echo WORDMARK-OK || exit 1
          test "$(unzip -p work/be-rebuilt-signed.apk AndroidManifest.xml | grep -a -c 'MANAGE_EXTERNAL_STORAGE')" = "0" && echo MANAGE-GONE || exit 1
          test "$(unzip -p work/be-rebuilt-signed.apk 'classes*.dex' | grep -a -c 'fwpnkj' || true)" = "0" && echo PROMO-GONE || exit 1
          "$BT/aapt2" dump resources work/be-rebuilt-signed.apk 2>/dev/null | grep -c 'Beyond Effects' | grep -q -E '[1-9]' && echo STRINGS-OK || exit 1
          "$BT/aapt2" dump resources work/be-rebuilt-signed.apk 2>/dev/null | grep -c 'Beyond Effects' | grep -q -E '[1-9]' && echo STRINGS-OK || exit 1
          "$BT/aapt2" dump xmltree work/be-rebuilt-signed.apk --file res/layout/project_list_sidemenu_header.xml > /tmp/be_header.txt 2>&1; grep -c 'Beyond Effects' /tmp/be_header.txt | grep -q -E '[1-9]' && echo DRAWER-BRAND-OK || exit 1
          sha256sum work/be-rebuilt-signed.apk
      - name: Upload rebuilt APK (only if requested)
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: be-rebuilt-signed
          path: work/be-rebuilt-signed.apk
          retention-days: 7
