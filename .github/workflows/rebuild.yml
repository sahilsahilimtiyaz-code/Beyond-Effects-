          ]
          bad = 0
          for o, t in pairs:
              if o in ('overlay-23a/res/layout/activity_edit.xml',
                       'overlay-24a/res/layout/activity_edit.xml',
                       'overlay-26a/res/layout/activity_edit_navbar.xml',
